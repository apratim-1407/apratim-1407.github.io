</script>

<style>
/* Horizontal travel book: 14 pages slide sideways. Card alternates left/right. One hands-on action per page, named in a pill at the foot. Route map lives in the location bar. */
:root{
  --gold:#f2cc7b; --cream:#f8ecd4; --ink:#14080c; --card:rgba(20,8,12,.82); --line:rgba(242,204,123,.32); --dim:#cdb595;
  --display:'Yatra One',Georgia,serif; --body:'Mukta','Segoe UI',sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--ink);color:var(--cream);font-family:var(--body);font-weight:300;line-height:1.55;font-size:16px;overscroll-behavior:none}
a{color:var(--gold)}
button,input{font-family:var(--body)}

.deck{position:relative;height:100%;display:flex;will-change:transform;transition:transform 1s cubic-bezier(.77,0,.18,1)}
.pg{position:relative;flex:0 0 100vw;width:100vw;height:100%;overflow:hidden;isolation:isolate;display:flex;align-items:center;
  padding:calc(112px + env(safe-area-inset-top,0px)) max(24px,5vw,env(safe-area-inset-right,0px)) 112px max(24px,5vw,env(safe-area-inset-left,0px))}
.pg.R{justify-content:flex-end}.pg.C{justify-content:center}
.art{position:absolute;inset:-2px -12vw;z-index:-2;transition:transform 1s cubic-bezier(.77,0,.18,1);will-change:transform}
.art svg{width:100%;height:100%;display:block}
.drag .art{touch-action:none}
.drag{-webkit-user-select:none;user-select:none}
.shade{position:absolute;inset:0;z-index:-1;pointer-events:none}
.L .shade{background:linear-gradient(90deg,rgba(12,4,7,.6),rgba(12,4,7,.12) 48%,transparent 68%)}
.R .shade{background:linear-gradient(270deg,rgba(12,4,7,.6),rgba(12,4,7,.12) 48%,transparent 68%)}

.card{position:relative;width:min(500px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;
  clip-path:inset(0 100% 0 0 round 18px);transition:clip-path 1s cubic-bezier(.77,0,.18,1) .45s}
.R .card{clip-path:inset(0 0 0 100% round 18px)}
.C .card{clip-path:inset(50% 0 50% 0 round 18px)}
.on .card{clip-path:inset(0 0 0 0 round 18px)}
.card>*{opacity:0;transform:translateY(12px);transition:opacity .55s ease,transform .6s cubic-bezier(.22,1,.36,1)}
.on .card>*{opacity:1;transform:none}
.on .card>*:nth-child(1){transition-delay:.8s}.on .card>*:nth-child(2){transition-delay:.88s}.on .card>*:nth-child(3){transition-delay:.96s}
.on .card>*:nth-child(4){transition-delay:1.04s}.on .card>*:nth-child(5){transition-delay:1.12s}.on .card>*:nth-child(6){transition-delay:1.2s}
.on .card>*:nth-child(7){transition-delay:1.28s}.on .card>*:nth-child(8){transition-delay:1.36s}.on .card>*:nth-child(9){transition-delay:1.44s}
.meta{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.no{font-family:var(--display);font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums}
.cat{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.cat.exp{border-color:#6fc3b2;color:#a8e6d8}.cat.res{border-color:#e59a8c;color:#f6c3b8}.cat.cs{border-color:#f2cc7b;color:#f8dfa6}
.cat.bld{border-color:#9fd27a;color:#c9eeac}.cat.oth{border-color:#b7a6e8;color:#d8ccff}
h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,3.4vw,32px);line-height:1.14;margin:0 0 3px;color:#fff3dc;text-wrap:balance}
.sub{font-size:13px;color:var(--dim);margin:0 0 10px}
.hook{font-size:16px;margin:0 0 10px;color:#fff0d6;font-weight:400}
ul.pts{margin:0 0 12px;padding-left:18px;display:grid;gap:5px}
ul.pts li{font-size:14.3px;color:#ead8bb}
b{color:var(--gold);font-weight:600}
.mets{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 12px;padding-top:11px;border-top:1px solid rgba(242,204,123,.2)}
.mets div{display:flex;flex-direction:column}
.mets strong{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05;color:var(--gold);font-variant-numeric:tabular-nums}
.mets span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.go{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#3a0f06;background:var(--gold);border:1px solid var(--gold);
  border-radius:999px;padding:7px 16px;text-decoration:none;cursor:pointer;transition:transform .15s,opacity .2s}
.go:hover{transform:translateY(-2px)}.go.gh{background:transparent;color:var(--gold)}.go[disabled]{opacity:.5;cursor:default;transform:none}
.go:focus-visible,.ib:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tools span{font-size:12px;border:1px solid rgba(242,204,123,.35);border-radius:6px;padding:2px 8px;color:#ead8bb}
.out{margin:0 0 12px;padding:9px 12px;border-radius:12px;background:rgba(242,204,123,.1);border-left:3px solid var(--gold);font-size:13.5px;color:#fff0d6;min-height:20px}
.out em{font-style:normal;color:var(--gold);font-weight:600}
.ctl{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.ctl input[type=range]{flex:1;min-width:160px;accent-color:#f2cc7b}
.ctl input[type=text]{flex:1;min-width:170px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:8px 11px;font-size:14px}
.chip{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 11px;background:#3a2a10;color:var(--gold);transition:background .3s,color .3s}
.chip.p{background:#5a3a10;color:#ffd98a}.chip.ok{background:#1f5a3a;color:#bff0c8}
.form{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px;background:rgba(242,230,204,.06)}
.form h4{margin:0 0 8px;font-family:var(--display);font-weight:400;color:#fff3dc;font-size:17px}
.form .f{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-top:1px dashed rgba(242,204,123,.25);padding:6px 0;animation:rise .4s ease both}
.form .f span:last-child{color:var(--dim);white-space:nowrap}
.form small{display:block;color:var(--dim);font-size:11.5px;margin-top:6px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* cover */
.cover .card{width:min(620px,100%);text-align:center;padding:30px 26px 26px;background:rgba(20,8,12,.55)}
.kick{font-size:11.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin:0 0 10px;font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,8vw,70px);line-height:1.02;margin:0;color:#fff3dc}
.role{font-size:clamp(15px,2.6vw,18px);margin:8px 0 0;color:#fff0d6;font-weight:400}
.how{margin:16px auto 0;max-width:46ch;font-size:15px;color:#ead8bb}
.cover .links{justify-content:center;margin-top:20px}

/* action pill: what to do */
.act{position:absolute;z-index:4;right:24px;bottom:84px;transform:translateY(10px);display:flex;align-items:center;gap:8px;
  background:rgba(14,5,8,.85);border:1px solid var(--gold);border-radius:999px;padding:5px 13px 5px 5px;font-size:12.5px;font-weight:500;color:#fff3dc;
  white-space:nowrap;opacity:0;transition:opacity .5s ease 1.6s,transform .6s ease 1.6s;pointer-events:none;max-width:calc(100vw - 32px)}
.on .act{opacity:1;transform:none}
.act .gi{flex:none;width:23px;height:23px;border-radius:50%;background:var(--gold);display:grid;place-items:center;animation:gip 1.8s ease-in-out infinite}
.act .gi svg{width:14px;height:14px}
/* just above the bottom bar: "Hide content" on the left, the instruction pill on the right */
.dock{position:absolute;z-index:4;left:max(24px,env(safe-area-inset-left,0px));right:max(24px,env(safe-area-inset-right,0px));bottom:84px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
.dock .act{position:static;right:auto;bottom:auto;margin-left:auto}
.hc{pointer-events:auto;flex:none;display:inline-flex;align-items:center;gap:7px;background:rgba(14,5,8,.85);color:#fff3dc;border:1px solid var(--gold);border-radius:999px;
  padding:7px 15px;font-size:12.5px;font-weight:600;cursor:pointer;opacity:0;transition:opacity .5s ease 1.6s}
.on .hc{opacity:1}.hc:hover{background:rgba(40,16,20,.95)}.hc:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
.pg.hidec .card{opacity:0!important;visibility:hidden!important;pointer-events:none;transition:opacity .3s ease,visibility 0s .3s!important}
.act.fact{white-space:normal;max-width:min(360px,calc(100vw - 32px));border-radius:14px;align-items:flex-start;padding:8px 13px 8px 8px;line-height:1.4}
.act.fact b{color:var(--gold)}
@keyframes gip{0%,100%{box-shadow:0 0 0 0 rgba(242,204,123,.6)}60%{box-shadow:0 0 0 10px rgba(242,204,123,0)}}
.act span.t{overflow:hidden;text-overflow:ellipsis}
.dial{position:absolute;z-index:4;bottom:142px;left:32%;transform:translateX(-50%);width:min(380px,80vw);display:flex;gap:10px;align-items:center;
  background:rgba(14,5,8,.82);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.dial input{flex:1;accent-color:#f2cc7b}
@media(max-width:1100px){.dial{left:50%}}

/* location bar with route map */
/* top, full width: the map, "Stop n of 14", the title and the place link */
.pin{position:absolute;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px));
  background:rgba(14,5,8,.88);border-bottom:1px solid var(--line)}
.map{flex:none;width:84px;height:76px;background:rgba(20,8,12,.95);border:1px solid var(--line);border-radius:12px;padding:4px}
.map svg{width:100%;height:100%;display:block}
.map .curp{transform-box:fill-box;transform-origin:50% 100%;transform:translateY(-8px) scale(.4);opacity:0;transition:transform .7s cubic-bezier(.3,1.7,.5,1) 1.1s,opacity .3s 1.1s}
.on .map .curp{transform:none;opacity:1}
.map .trail{stroke-dasharray:400;stroke-dashoffset:400;transition:stroke-dashoffset 1.6s ease .7s}
.on .map .trail{stroke-dashoffset:0}
.pin .tx{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.pin .td{display:flex;flex-direction:column}
.pin .td i{font-style:normal;color:var(--gold);font-weight:600;font-size:12.5px;letter-spacing:.06em}
.pin .tt{font-size:15px;color:#fff0d6;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pin .loc{font-size:12px;color:var(--dim)}
.pin .loc a{color:var(--dim);text-decoration:underline;text-decoration-color:rgba(205,181,149,.5)}
.pin .nt{display:none}

/* bottom bar: where you are (count), sound, contents, previous, next */
.bar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  background:rgba(14,5,8,.9);border-top:1px solid var(--line);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.bar .sp{flex:1}
.tl,.nv{display:contents}
/* DESKTOP layout (not the phone version): the top of the screen is empty except Sound and Contents
   at the top-right; the bottom has the map strip on the left and Previous / Next on the right. No page count. */
html:not(.lite) .bar{display:contents}
html:not(.lite) .bar .cnt,html:not(.lite) .bar .sp{display:none}
html:not(.lite) .tl{display:flex;gap:10px;position:fixed;z-index:30;top:calc(14px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px))}
html:not(.lite) .nv{display:flex;gap:8px;align-items:center;position:fixed;z-index:31;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(11px + env(safe-area-inset-bottom,0px))}
html:not(.lite) .pg{padding-top:calc(62px + env(safe-area-inset-top,0px));padding-bottom:150px}
html:not(.lite) .pin{top:auto;bottom:0;left:0;right:0;gap:14px;min-height:62px;
  padding:10px 210px calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));border-bottom:0;border-top:1px solid var(--line)}
html:not(.lite) .map{width:92px;height:84px;margin-top:-40px}
html:not(.lite) .pin .td{display:block;font-size:14px;color:#fff0d6;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html:not(.lite) .pin .td i{display:inline;font-size:inherit;letter-spacing:0;margin-right:6px}
html:not(.lite) .pin .tt{display:inline;font-size:inherit;-webkit-line-clamp:unset}
@media(min-width:1050px){html:not(.lite) .pin .nt{display:block;font-size:12px;color:var(--dim);font-style:italic;margin-left:auto;max-width:42ch}}
html:not(.lite) .dock{bottom:116px}
html:not(.lite) .hc{display:none}
.bar .cnt{font-family:var(--display);font-size:17px;letter-spacing:.06em;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap;margin-right:8px}
.ib{display:inline-flex;align-items:center;gap:6px;background:rgba(14,5,8,.6);color:var(--cream);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;cursor:pointer}
.ib:hover{border-color:var(--gold)}
.bar .pv,.bar .nx{height:40px;border-radius:999px;border:1px solid var(--gold);background:rgba(14,5,8,.7);color:var(--gold);cursor:pointer;font-weight:600;font-size:13px;letter-spacing:0;text-transform:none}
.bar .pv{width:40px}
.bar .nx{padding:0 16px;background:var(--gold);color:#3a0f06;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.05;min-width:118px}
.bar .nx small{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:600}
.bar .pv:disabled{opacity:.3;cursor:default}
.toc{position:fixed;inset:0;z-index:40;background:rgba(12,4,7,.95);overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 40px max(22px,env(safe-area-inset-left,0px))}
.toc .in{max-width:860px;margin:0 auto}
.toc .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.toc h3{font-family:var(--display);font-weight:400;font-size:26px;color:var(--gold);margin:0}
.toc ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.toc li button{width:100%;text-align:left;display:grid;grid-template-columns:30px 1fr;gap:1px 8px;color:var(--cream);background:none;
  border:1px solid rgba(242,204,123,.2);border-radius:10px;padding:10px 12px;cursor:pointer}
.toc li button:hover{border-color:var(--gold)}
.toc .n{font-family:var(--display);color:var(--gold);grid-row:span 2;font-size:18px}
.toc .t{font-size:14px;font-weight:500;line-height:1.3}.toc .p{font-size:11.5px;color:var(--dim)}

@media(max-width:760px){
  .pg,.pg.R,.pg.C{align-items:flex-start;justify-content:center;padding-top:calc(84px + env(safe-area-inset-top,0px));padding-bottom:84px}
  .card{width:100%;max-height:calc(100% - 20px);overflow-y:auto;padding:16px 15px 14px;border-radius:16px}
  .cover .card{margin-top:4vh}
  .hook{font-size:15px} ul.pts li{font-size:13.6px} ul.pts li:nth-child(3){display:none}
  .mets strong{font-size:22px}
  .pin{gap:9px;padding:calc(6px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px))}
  .map{width:58px;height:52px;padding:3px;border-radius:10px}
  .pin .td i{font-size:12px}.pin .tt{font-size:13.5px;line-height:1.25}.pin .loc{font-size:11.5px}
  .act{font-size:12px}
  /* "Hide content" and the instruction pill: same line, side by side, same height */
  .dock{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:72px;flex-direction:row;align-items:stretch;justify-content:flex-start;gap:8px}
  .hc{align-self:stretch}
  .dock .act{align-self:stretch;flex:1;min-width:0;max-width:none;margin-left:0;white-space:normal;border-radius:20px;line-height:1.25}
  .dock .act.fact{border-radius:16px}
  .dock:has(.act.fact) .hc{align-self:flex-end}
  .bar{gap:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .bar .cnt{font-size:15px;margin-right:2px}
  .bar .nx{min-width:84px;padding:0 12px}.bar .nx small{display:none}
  #sndL{display:none}.ib{white-space:nowrap;padding:6px 10px}
  .L .shade,.R .shade{background:linear-gradient(180deg,rgba(12,4,7,.45),transparent 55%)}
}

/* scene motion */
.int{cursor:pointer}
.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-5px) rotate(1.5deg)}}
.jolt{transform-box:fill-box;transform-origin:50% 100%;animation:jolt .5s ease-in-out infinite}@keyframes jolt{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.walk{animation:walk 46s linear infinite}@keyframes walk{from{transform:translateX(260px)}to{transform:translateX(-520px)}}
.flut{transform-box:fill-box;transform-origin:50% 50%;animation:flut 3.2s ease-in-out infinite}@keyframes flut{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.glint{animation:tw 2.2s ease-in-out infinite}
.shoot{animation:shoot 7s ease-in infinite;opacity:0}@keyframes shoot{0%,82%{opacity:0;transform:translate(0,0)}86%{opacity:1}100%{opacity:0;transform:translate(-420px,210px)}}
.win{transition:fill .35s}.win.l{fill:#ffd98a}
.stp{opacity:0;transform-box:fill-box;transform-origin:50% 50%;transform:scale(1.25);transition:opacity 1.2s ease,transform 1.4s cubic-bezier(.2,.8,.3,1)}
.stp.s{opacity:1;transform:scale(1)}
.burst{transform-box:fill-box;transform-origin:50% 50%;animation:burst .9s ease-out forwards}@keyframes burst{0%{transform:scale(.2);opacity:1}100%{transform:scale(3);opacity:0}}
.ripple{transform-box:fill-box;transform-origin:50% 50%;animation:burst 1.6s ease-out infinite}
.note{animation:note 2.2s ease-out forwards}@keyframes note{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-200px)}}
.spark{animation:spark 1.3s ease-out forwards}@keyframes spark{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.steam{animation:steam 1.6s ease-out forwards}@keyframes steam{0%{opacity:.9;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-150px) scale(1.7)}}

  var mir=p.side==='R';
  var art='<div class="art"><svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><g class="world"'+(mir?' transform="translate(1600 0) scale(-1 1)"':'')+'>'+p.scene()+'</g></svg></div><div class="shade"></div>';
  var card;
  if(p.cover){card='<div class="card"><p class="kick">Product portfolio · 2026</p><h1>Apratim Saxena</h1><p class="role">APM · Product Analyst</p>'+
    '<p class="how">Rajasthan is home, so this portfolio is a journey: <b>14 stops across Rajasthan</b>, and at each one, a piece of my work. Every page has something to touch, and a map at the bottom shows where you are.</p>'+
    '<div class="links"><button class="go" data-go="1">Start the journey →</button><a class="go gh" href="'+A+'resume.pdf">Resume</a></div></div>';}
  else{card='<article class="card"><div class="meta"><span class="no">'+num+' / 14</span><span class="cat '+p.cls+'">'+p.cat+'</span></div><h2>'+p.title+'</h2><p class="sub">'+p.sub+'</p><p class="hook">'+p.hook+'</p>'+
    (p.outx?'<div class="out">'+p.outx+'</div>':'')+(p.ctl?'<div class="ctl">'+p.ctl+'</div>':'')+(p.extra||'')+
    (p.pts?'<ul class="pts">'+p.pts.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul>':'')+
    (p.tools?'<div class="tools">'+p.tools.map(function(t){return '<span>'+t+'</span>';}).join('')+'</div>':'')+
    (p.mets?'<div class="mets">'+p.mets.map(function(m){return '<div><strong data-v="'+m[0]+'">'+m[0]+'</strong><span>'+m[1]+'</span></div>';}).join('')+'</div>':'')+
    (p.links?'<div class="links">'+p.links.map(function(l){return '<a class="go'+(l[2]?' gh':'')+'" href="'+l[1]+'">'+l[0]+'</a>';}).join('')+'</div>':'')+'</article>';}
  var pa=(LITE&&p.actL)||p.act;
  var act=!pa?'':'<div class="act'+(pa[0]==='info'?' fact':'')+'" role="note"><span class="gi"><svg><use href="#'+GI[pa[0]]+'"/></svg></span><span class="t">'+pa[1]+'</span></div>';
  var pin='<footer class="pin"><div class="map">'+routeSVG(i)+'</div><span class="tx"><span class="td"><i>Stop '+n+' of 14</i><span class="tt">'+p.todo+'</span></span><span class="loc"><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.maps)+'">'+p.loc+' ↗</a></span></span><span class="nt">'+p.nt+'</span></footer>';
  sec.innerHTML=art+card+'<div class="dock"><button type="button" class="hc" aria-pressed="false">Hide content</button>'+act+'</div>'+(p.overlay||'')+pin;deck.appendChild(sec);
  (function(hc){hc.addEventListener('click',function(e){e.stopPropagation();var h=sec.classList.toggle('hidec');hc.textContent=h?'Show content':'Hide content';hc.setAttribute('aria-pressed',h?'true':'false');});})(sec.querySelector('.hc'));
  if(mir){sec.querySelectorAll('.world text').forEach(function(t){var x=+t.getAttribute('x');t.setAttribute('transform','translate('+(2*x)+' 0) scale(-1 1)');});
    sec.querySelectorAll('.world foreignObject').forEach(function(f){var c=+f.getAttribute('x')+(+f.getAttribute('width'))/2;f.setAttribute('transform','translate('+(2*c)+' 0) scale(-1 1)');});}
  if(p.init)p.init(sec);
  var li=document.createElement('li');li.innerHTML='<button><span class="n">'+n+'</span><span class="t">'+(p.cover?'Start here':p.title)+'</span><span class="p">'+p.loc+'</span></button>';li.firstChild.onclick=function(){toc.hidden=true;go(i);};tocL.appendChild(li);
});

/* ---------------------------------------------------------------- NAV */
var pages=[].slice.call(deck.children),cur=-1,toc=document.getElementById('toc'),prev=document.getElementById('prev'),next=document.getElementById('next');
function frame(){var m=innerWidth<=760;pages.forEach(function(s,i){var svg=s.querySelector('.art svg'),p=P[i],fx=p.side==='R'?1600-p.fx:p.fx;svg.setAttribute('viewBox',m?(fx-520)+' 0 1040 900':'0 0 1600 900');});}
function countUp(sec){sec.querySelectorAll('.mets strong').forEach(function(s){var v=s.dataset.v,m=v.match(/^([^\d]*)([\d,.]+)(.*)$/);if(!m||reduce||LITE){s.textContent=v;return;}
  var num=parseFloat(m[2].replace(/,/g,'')),dec=(m[2].split('.')[1]||'').length,comma=m[2].indexOf(',')>-1,t0=null;
  function f(x){var y=dec?x.toFixed(dec):Math.round(x).toString();if(comma)y=Number(y).toLocaleString('en-IN');return m[1]+y+m[3];}
  s.textContent=f(0);setTimeout(function(){requestAnimationFrame(function st(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/1100);s.textContent=f(num*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(st);});},1300);});}
/* phones: a "scroll for more" cue while the card has text below the fold */
function cue(sec){var c=sec.querySelector('.card');if(!c)return;c.classList.toggle('more',c.scrollHeight>c.clientHeight+6&&c.scrollTop+c.clientHeight<c.scrollHeight-6);}
function go(i){i=Math.max(0,Math.min(pages.length-1,i));if(i===cur)return;if(cur>=0)pages[cur].dispatchEvent(new Event('leave'));
  if(LITE&&cur>=0&&Math.abs(i-cur)>1){deck.style.transition='none';requestAnimationFrame(function(){requestAnimationFrame(function(){deck.style.transition='';});});}
  cur=i;
  deck.style.transform='translate3d('+(-i*100)+'vw,0,0)';
  pages.forEach(function(s,j){if(LITE)s.classList.toggle('near',Math.abs(j-i)<=1);else s.querySelector('.art').style.transform='translate3d('+((j-i)*-45)+'vw,0,0)';s.classList.toggle('on',j===i);s.inert=(j!==i);});
  if(LITE)setTimeout(function(){cue(pages[i]);},700);
  document.getElementById('cnt').textContent=(i<9?'0':'')+(i+1)+' / 14';
  setMood(i);
  prev.disabled=i===0;var last=i===pages.length-1;
  document.getElementById('nextLab').textContent=i===0?'Begin →':(last?'Start over ↺':'Next →');
  document.getElementById('nextPlace').textContent=last?'Back to the dunes':'Next: '+P[i+1].place;
  pages[i].dispatchEvent(new Event('enter'));countUp(pages[i]);}
prev.onclick=function(){go(cur-1);};next.onclick=function(){go(cur===pages.length-1?0:cur+1);};
deck.addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b){e.stopPropagation();go(+b.dataset.go);}});
document.getElementById('tocBtn').onclick=function(){toc.hidden=false;document.getElementById('tocClose').focus();};
document.getElementById('tocClose').onclick=function(){toc.hidden=true;};
document.addEventListener('keydown',function(e){if(e.target.matches('input'))return;if(e.key==='Escape')toc.hidden=true;if(!toc.hidden)return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(cur+1);}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}});
var lock=0;addEventListener('wheel',function(e){if(!toc.hidden)return;var c=e.target.closest('.card');if(c&&c.scrollHeight>c.clientHeight+4)return;
  var d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(Math.abs(d)<24||Date.now()<lock)return;lock=Date.now()+1100;go(cur+(d>0?1:-1));},{passive:true});
var sx=0,sy=0,ok=false;deck.addEventListener('touchstart',function(e){var t=e.target;ok=!t.closest(LITE?'input,button,a,.int,.ctl':'input,button,a,.int,.ctl,.drag .art,#p4 .art');sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
deck.addEventListener('touchend',function(e){if(!ok)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)go(cur+(dx<0?1:-1));},{passive:true});
pages.forEach(function(s){var c=s.querySelector('.card');if(c)c.addEventListener('scroll',function(){cue(s);},{passive:true});});
addEventListener('resize',function(){frame();if(LITE&&cur>=0)cue(pages[cur]);});frame();requestAnimationFrame(function(){go(0);});

/* ---------------------------------------------------------------- AMBIENT MUSIC
   Five soothing moods, all synthesised live, crossfading as you travel:
   tanpura + flute (desert), santoor (water and mirrors), warm pad + bells (cities),
   forest (wind, low drone, birds), desert fort (wind, drone, a slow bowed melody). */
var AC=null,master=null,bus=null,noiseBuf=null,soundOn=false,userMuted=false,timer=null,mcur=null,wantMood=0;
var sndBtn=document.getElementById('snd'),sndL=document.getElementById('sndL');
var MOOD_OF=['tan','santoor','pad','santoor','forest','desert','pad','tan','santoor','pad','pad','tan','santoor','tan'];
function buildAudio(){var Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return false;AC=new Ctx();
  master=AC.createGain();master.gain.value=0;var comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;master.connect(comp);comp.connect(AC.destination);
  var len=AC.sampleRate*3.8,buf=AC.createBuffer(2,len,AC.sampleRate);for(var c=0;c<2;c++){var d=buf.getChannelData(c);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
  var conv=AC.createConvolver();conv.buffer=buf;var wet=AC.createGain();wet.gain.value=.45;conv.connect(wet);wet.connect(master);
  var dry=AC.createGain();dry.gain.value=.72;dry.connect(master);bus=AC.createGain();bus.connect(dry);bus.connect(conv);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);var nd=noiseBuf.getChannelData(0);for(var k=0;k<nd.length;k++)nd[k]=Math.random()*2-1;return true;}
function cosc(st,type,f,gain,dest,det){var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;g.gain.value=gain;o.connect(g);g.connect(dest);o.start();st.srcs.push(o);return o;}
function env(g,t,peak,att,dec){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+att+dec);}
function rnd(a){return a[Math.random()*a.length|0];}
/* voices */
function tan(f,t,v,dest){var out=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4200;out.connect(lp);lp.connect(dest);
  for(var n=1;n<=12;n++){var o=AC.createOscillator(),g=AC.createGain(),amp=v/Math.pow(n,.8),dec=6.2/(1+n*.11);o.type='sine';o.frequency.value=f*n*(1+(Math.random()-.5)*.0016);o.connect(g);g.connect(out);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(amp*(n<3?1:.3),t+.012);if(n>=3)g.gain.linearRampToValueAtTime(amp*.9,t+.3+n*.05);g.gain.exponentialRampToValueAtTime(.0001,t+dec);o.start(t);o.stop(t+dec+.1);}}
function flute(f,t,d,v,dest){var o=AC.createOscillator(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();o.type='sine';o.frequency.value=f;lfo.frequency.value=5.2;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.006,t+d*.6);
  lfo.connect(lg);lg.connect(o.frequency);o.connect(g);g.connect(dest);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.22);g.gain.setValueAtTime(v,t+d-.1);g.gain.linearRampToValueAtTime(0,t+d+.45);
  var ns=AC.createBufferSource(),bp=AC.createBiquadFilter(),ng=AC.createGain();ns.buffer=noiseBuf;ns.loop=true;bp.type='bandpass';bp.frequency.value=f*2;bp.Q.value=1.5;ns.connect(bp);bp.connect(ng);ng.connect(dest);
  ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(v*.22,t+.15);ng.gain.linearRampToValueAtTime(0,t+d+.3);[o,lfo].forEach(function(x){x.start(t);x.stop(t+d+.6);});ns.start(t);ns.stop(t+d+.5);}
function santoor(f,t,v,dest){[[1,1],[2,.45],[3.01,.22],[4.2,.1]].forEach(function(h,i){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*h[0];o.connect(g);g.connect(dest);env(g,t,v*h[1],.004,1.7/(1+i*.6));o.start(t);o.stop(t+2);});}
function bell(f,t,v,dest){[[1,1],[2.76,.35],[5.4,.12]].forEach(function(h,i){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*h[0];o.connect(g);g.connect(dest);env(g,t,v*h[1],.006,4.2/(1+i));o.start(t);o.stop(t+4.5);});}
function bowed(f,t,d,v,dest){var o=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();o.type='sawtooth';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=1300;
  lfo.frequency.value=5;lg.gain.value=f*.007;lfo.connect(lg);lg.connect(o.frequency);o.connect(lp);lp.connect(g);g.connect(dest);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.9);g.gain.setValueAtTime(v,t+d);g.gain.linearRampToValueAtTime(0,t+d+1.4);
  o.start(t);lfo.start(t);o.stop(t+d+1.5);lfo.stop(t+d+1.5);}
function chirp(t,dest){for(var k=0;k<2+(Math.random()*2|0);k++){var o=AC.createOscillator(),g=AC.createGain(),tt=t+k*.13,f0=2300+Math.random()*900;o.type='sine';o.frequency.setValueAtTime(f0,tt);o.frequency.exponentialRampToValueAtTime(f0*1.45,tt+.08);o.connect(g);g.connect(dest);env(g,tt,.012,.01,.09);o.start(tt);o.stop(tt+.15);}}
function windBed(st,dest,lvl){var ns=AC.createBufferSource();ns.buffer=noiseBuf;ns.loop=true;var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=480;bp.Q.value=.7;var g=AC.createGain();g.gain.value=lvl;
  ns.connect(bp);bp.connect(g);g.connect(dest);ns.start();st.srcs.push(ns);var l1=cosc(st,'sine',.05,280,bp.frequency),l2=cosc(st,'sine',.08,lvl*.7,g.gain);}
/* moods */
var Sc={S:261.63,R:293.66,G:329.63,m:349.23,P:392,D:440,N:493.88,S2:523.25,R2:587.33,G2:659.25};
var PHR=[[['P',1.2],['D',.7],['S2',1.6],['N',.7],['D',.7],['P',2]],[['G',1.1],['m',.7],['P',1.4],['G',.9],['R',.7],['S',2.2]],[['S',.9],['R',.7],['G',1.2],['P',1.6],['m',.8],['G',.8],['R',2]],[['D',1],['P',.8],['m',.8],['G',1.4],['R',.8],['S',2.2]]];
var CH=[[130.81,164.81,196,246.94],[110,164.81,196,261.63],[87.31,174.61,220,261.63],[98,146.83,196,246.94]];
var MOODS={
 tan:{start:function(st){cosc(st,'sine',65.41,.035,st.g);cosc(st,'sine',130.81,.012,st.g);st.ph=st.nextT+7;},
  tick:function(st,until){while(st.nextT<until){var t=st.nextT;[[98,0,.085],[130.81,1.25,.065],[130.81,2,.065],[65.41,2.75,.1]].forEach(function(x){tan(x[0],t+x[1],x[2],st.g);});
    if(t>=st.ph){var tt=t+1.2;rnd(PHR).forEach(function(n){flute(Sc[n[0]],tt,n[1],.03,st.g);tt+=n[1];});st.ph=t+4.7*(3+(Math.random()*2|0));}st.nextT+=4.7;}}},
 santoor:{start:function(st){var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;lp.connect(st.g);cosc(st,'triangle',130.81,.03,lp);cosc(st,'triangle',196,.02,lp,4);cosc(st,'sine',65.41,.03,st.g);st.idx=3;st.left=10;},
  tick:function(st,until){var SC=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99];while(st.nextT<until){var t=st.nextT;
    if(st.left<=0){st.left=8+(Math.random()*7|0);st.nextT+=2.6+Math.random()*1.5;if(Math.random()<.5){var f=SC[st.idx];for(var r=0;r<7;r++)santoor(f,t+r*.075,.05*(1-r*.1),st.g);}continue;}
    st.idx=Math.max(0,Math.min(SC.length-1,st.idx+rnd([-2,-1,-1,1,1,2])));var f2=SC[st.idx];santoor(f2,t,.055,st.g);santoor(f2,t+.07,.022,st.g);st.left--;st.nextT+=.3+(st.left%2?.04:0);}}},
 pad:{start:function(st){var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=950;lp.connect(st.g);st.v=CH[0].map(function(f){return [cosc(st,'triangle',f,.016,lp),cosc(st,'sine',f,.014,lp,5)];});
    var l=cosc(st,'sine',.07,260,lp.frequency);st.ci=0;st.bt=st.nextT+2;},
  tick:function(st,until){while(st.nextT<until){var t=st.nextT;st.ci=(st.ci+1)%4;CH[st.ci].forEach(function(f,i){st.v[i].forEach(function(o){o.frequency.setTargetAtTime(f,t,1.2);});});
    for(var b=0;b<3;b++)if(Math.random()<.6)bell(rnd(CH[st.ci])*4,t+1+b*2.3+Math.random(),.016,st.g);st.nextT+=8;}}},
 forest:{start:function(st){windBed(st,st.g,.045);cosc(st,'sine',73.42,.03,st.g);cosc(st,'sine',110,.012,st.g);},
  tick:function(st,until){while(st.nextT<until){var t=st.nextT;if(Math.random()<.7)chirp(t+Math.random()*1.5,st.g);if(Math.random()<.25)bell(rnd([293.66,440,587.33]),t+1,.012,st.g);st.nextT+=2.2+Math.random()*2;}}},
 desert:{start:function(st){windBed(st,st.g,.05);cosc(st,'sine',73.42,.035,st.g);cosc(st,'sine',146.83,.012,st.g);st.k=0;},
  tick:function(st,until){var M=[[293.66,2.4],[329.63,1.6],[349.23,2.6],[329.63,1.4],[293.66,3.2],[220,2.2],[261.63,1.6],[293.66,3.4]];while(st.nextT<until){var n=M[st.k%M.length];bowed(n[0],st.nextT,n[1],.02,st.g);st.nextT+=n[1]+.8;st.k++;if(st.k%M.length===0)st.nextT+=4;}}}
};
function activate(name){var t=AC.currentTime;if(mcur&&mcur.name===name)return;
  if(mcur){var old=mcur;old.g.gain.cancelScheduledValues(t);old.g.gain.setValueAtTime(old.g.gain.value,t);old.g.gain.linearRampToValueAtTime(0,t+2.6);setTimeout(function(){old.srcs.forEach(function(x){try{x.stop();}catch(e){}});old.g.disconnect();},2900);}
  var g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+3);g.connect(bus);mcur={name:name,g:g,srcs:[],nextT:t+.4};MOODS[name].start(mcur);}
function setMood(i){wantMood=i;if(AC&&soundOn)activate(MOOD_OF[i]);}
function schedule(){if(mcur)MOODS[mcur.name].tick(mcur,AC.currentTime+.7);}
function soundStart(){if(userMuted&&arguments[0]!=='force')return;if(!AC&&!buildAudio())return;AC.resume();soundOn=true;activate(MOOD_OF[wantMood]);
  var t=AC.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(master.gain.value,t);master.gain.linearRampToValueAtTime(.4,t+4);
  if(!timer)timer=setInterval(schedule,150);sndL.textContent='Sound on';sndBtn.setAttribute('aria-pressed','true');}
function soundStop(){if(!AC)return;soundOn=false;var t=AC.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(master.gain.value,t);master.gain.linearRampToValueAtTime(0,t+1.2);
  setTimeout(function(){if(!soundOn){clearInterval(timer);timer=null;AC.suspend();}},1300);sndL.textContent='Sound off';sndBtn.setAttribute('aria-pressed','false');}
sndBtn.addEventListener('click',function(){if(soundOn){userMuted=true;soundStop();}else{userMuted=false;soundStart('force');}});
/* on phones the sound stays off until the visitor taps the ♪ button */
pages[0].addEventListener('click',function(e){if(!LITE&&!e.target.closest('a,.hc'))soundStart();});
document.addEventListener('visibilitychange',function(){if(!AC)return;if(document.hidden&&soundOn)AC.suspend();else if(soundOn)AC.resume();});
})();
</script>
