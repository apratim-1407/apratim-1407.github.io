<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;600&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#14080c}
svg{display:block}
.d{font-family:'Yatra One',Georgia,serif}.b{font-family:'Mukta','Segoe UI',sans-serif}
</style></head><body>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b0a1c"/><stop offset=".38" stop-color="#4a1a22"/>
    <stop offset=".62" stop-color="#b34a26"/><stop offset=".82" stop-color="#f0a85a"/><stop offset="1" stop-color="#f7d68a"/>
  </linearGradient>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#fff2c4"/><stop offset=".45" stop-color="#ffd27a" stop-opacity=".95"/><stop offset="1" stop-color="#ffb04a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="vg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#14080c" stop-opacity=".78"/><stop offset=".5" stop-color="#14080c" stop-opacity=".25"/><stop offset="1" stop-color="#14080c" stop-opacity="0"/>
  </linearGradient>
  <symbol id="camel" viewBox="0 0 150 116"><g fill="currentColor" stroke="currentColor" stroke-linecap="round">
    <path d="M34 72c-4-18 4-30 20-34 14-4 36-6 50 0 10 4 14 14 12 24l-4 14c-24 6-54 6-78-4Z" stroke="none"/>
    <path d="M58 40c4-14 12-20 20-20s14 8 16 20c-12-4-24-4-36 0Z" stroke="none"/>
    <path d="M100 48c8-6 14-14 16-24 2-8 8-12 14-10 8 2 10 10 6 16-4 8-4 14-2 20" fill="none" stroke-width="12"/>
    <path d="M130 30c6-4 12-2 14 4 2 8-4 14-12 12" stroke="none"/>
    <path d="M46 74v32M58 74v30M92 74v30M104 74v32" fill="none" stroke-width="6"/></g></symbol>
</defs>

<rect width="1200" height="630" fill="url(#sk)"/>
<!-- stars -->
<g fill="#fff6dd" id="st"></g>
<!-- sun -->
<circle cx="900" cy="400" r="190" fill="url(#sun)"/>
<circle cx="900" cy="400" r="70" fill="#fff0bf"/>

<!-- far dunes -->
<path d="M0 470 C150 430 300 460 450 445 S760 430 900 450 S1100 440 1200 455 V630 H0Z" fill="#8a3a22" opacity=".9"/>

<!-- fort on the right (Mehrangarh-style silhouette) -->
<g fill="#3a1418">
  <path d="M700 470 L760 400 L840 392 L900 340 L1010 330 L1060 300 L1130 308 L1200 340 V580 H700Z"/>
  <rect x="930" y="270" width="26" height="72"/><rect x="926" y="262" width="34" height="12"/>
  <rect x="1040" y="236" width="30" height="78"/><rect x="1035" y="226" width="40" height="14"/>
  <rect x="1100" y="262" width="22" height="50"/><rect x="1096" y="254" width="30" height="10"/>
  <path d="M938 262 q8-22 16 0Z"/><path d="M1048 226 q7-26 14 0Z"/>
  <g id="bt"></g>
</g>
<g fill="#f6c36b" opacity=".85" id="win"></g>

<!-- near dunes -->
<path d="M0 520 C200 480 380 540 600 510 S960 480 1200 520 V630 H0Z" fill="#4a1a1a"/>
<path d="M0 575 C260 545 470 595 720 570 S1050 548 1200 572 V630 H0Z" fill="#2a0f12"/>

<!-- camel caravan -->
<use href="#camel" x="560" y="470" width="92" height="71" style="color:#14080c"/>
<use href="#camel" x="650" y="482" width="76" height="59" style="color:#14080c"/>
<use href="#camel" x="728" y="492" width="62" height="48" style="color:#14080c"/>

<!-- left readability veil -->
<rect width="1200" height="630" fill="url(#vg)"/>

<!-- text -->
<text x="72" y="118" class="b" font-size="21" font-weight="600" letter-spacing="5" fill="#f2cc7b">PRODUCT PORTFOLIO</text>
<text x="68" y="222" class="d" font-size="96" fill="#f8ecd4">Apratim</text>
<text x="68" y="318" class="d" font-size="96" fill="#f8ecd4">Saxena</text>
<text x="72" y="378" class="b" font-size="34" font-weight="600" fill="#f2cc7b">APM · Product Analyst</text>
<text x="72" y="424" class="b" font-size="28" fill="#f8ecd4">14 stops across Rajasthan</text>

<!-- route strip -->
<g id="route"></g>
</svg>
<script>
var ns='http://www.w3.org/2000/svg',seed=7;function r(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
var st=document.getElementById('st'),h='';for(var i=0;i<90;i++){var y=r()*300;h+='<circle cx="'+(r()*1200|0)+'" cy="'+(y|0)+'" r="'+(.6+r()*1.5).toFixed(1)+'" opacity="'+(.5+r()*.5).toFixed(2)+'"/>';}st.innerHTML=h;
var bt='';for(var x=0;x<0;x+=26)bt+='';document.getElementById('bt').innerHTML=bt;
var w='';[[948,288],[1054,256],[1108,278],[820,420],[880,402],[780,440],[990,352],[1020,346]].forEach(function(p){w+='<rect x="'+p[0]+'" y="'+p[1]+'" width="6" height="10" rx="3"/>';});document.getElementById('win').innerHTML=w;
/* 14-stop route: dotted line, gold trail, dots */
var rt='<line x1="72" y1="592" x2="1128" y2="592" stroke="#f2cc7b" stroke-opacity=".45" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>';
for(var k=0;k<14;k++){var x=72+k*(1056/13);rt+='<circle cx="'+x.toFixed(1)+'" cy="592" r="'+(k==0||k==13?9:5.5)+'" fill="'+(k==13?'#e0452d':'#f2cc7b')+'" stroke="#14080c" stroke-width="3"/>';}
document.getElementById('route').innerHTML=rt;
</script>
</body></html>
